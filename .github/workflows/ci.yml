# 검증을 사람의 기억에 맡기지 않는다.
#
# 이 저장소는 develop에 --no-ff로 머지하는 Git Flow를 쓴다 (ADR-0008).
# 머지 전에 무엇이 깨졌는지 알아야 하므로, feature 브랜치의 push와
# develop·main으로 가는 PR에서 모두 돈다.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# feature 브랜치에 연달아 push하면 앞 실행을 취소한다. 큐가 밀리지 않는다.
#
# **develop·main에서는 취소하지 않는다.** 머지를 연달아 하면 앞 머지 커밋의
# 검증이 취소되고, 그 커밋은 통합 브랜치에 검증되지 않은 채로 남는다.
# 실제로 한 번 그랬다 (run #4가 #5에 취소됨). 통합 브랜치의 모든 커밋은
# 각자 검증 기록을 남겨야 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    # 빌드가 DB를 필요로 한다. sitemap이 SSG라 부품 slug를 실제로 조회한다.
    # 빈 DB로 충분하다 — 여기서 확인하려는 것은 데이터가 아니라 쿼리와 스키마다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildfit
          POSTGRES_PASSWORD: buildfit
          POSTGRES_DB: buildfit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buildfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://buildfit:buildfit@localhost:5432/buildfit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 마이그레이션이 빈 DB에 적용되는지도 여기서 확인된다.
      - name: 마이그레이션
        run: npm run migrate

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      # 빌드는 마지막이다. 가장 오래 걸리고, 앞 단계가 깨졌으면 볼 필요가 없다.
      #
      # DB가 안 되면 빌드가 실패해야 한다. sitemap은 SSG라 조용히 비면
      # 빈 색인이 그대로 배포된다 (apps/web/src/app/sitemap.ts 참조).
      - name: 프로덕션 빌드
        run: npm run build
